name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-positioning-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK to repository
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/wifi-positioning-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/wifi-positioning-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit"
          else
            git commit -m "Commit built debug APK [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
